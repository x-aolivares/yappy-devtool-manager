<app-page-header
  title="Base de datos"
  description="El túnel a Aurora del ambiente. Es el puerto del que dependen Migrar datos, Ejecutar SQL y Sincronizar schema."
>
  <div class="field">
    <label class="field-label" for="wf-db-env">Ambiente</label>
    <select
      id="wf-db-env"
      [value]="env()"
      (change)="env.set($any($event.target).value)"
    >
      @for (e of envList().length ? envList() : [{ env: env() }]; track e.env) {
        <option [value]="e.env">{{ e.env }}</option>
      }
    </select>
  </div>
</app-page-header>

<div class="visually-hidden" role="status" aria-live="polite">{{ announcement() }}</div>

@if (readError()) {
  <div class="error-box">No se pudo leer el estado: {{ readError() }}</div>
}

<section class="panel">
  <div class="section-title section-title--plain">
    <strong>Base de datos</strong>
    <span class="muted">Aurora · <code>yappy run db</code></span>
  </div>

  <app-resource-cards
    [rows]="rows()"
    [busy]="busy()"
    emptyText="El túnel a la base de datos no está levantado. Sin él no contesta Migrar datos ni Ejecutar SQL."
    (start)="startResource($event)"
    (stop)="stopOne($event)"
    (logs)="logs()?.open($event)"
  />
</section>

<app-workflow-summary
  [text]="summary()"
  [canStopAll]="anythingAlive()"
  [canShowLogs]="logs()?.hasFirstLog() ?? false"
  (logs)="logs()?.openFirst()"
  (stopAll)="askStopAll()"
/>

<app-workflow-logs [rows]="logRows()" />

@if (busy()) {
  <app-busy-modal [open]="busy()" message="Trabajando…" [writes]="true" (cancelled)="dismissNotice()" />
}

@if (notice(); as n) {
  <app-notice-modal
    [open]="true"
    [title]="n.title"
    [tone]="n.tone"
    [confirmLabel]="n.confirmLabel ?? 'Entendido'"
    (confirmed)="confirmNotice()"
    (closed)="dismissNotice()"
  >
    @for (paragraph of n.paragraphs; track $index) {
      <p>{{ paragraph }}</p>
    }
  </app-notice-modal>
}
