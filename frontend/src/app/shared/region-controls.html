<app-env-controls
  [environments]="environments()"
  [services]="withService() ? services() : []"
  [roleLabels]="roles"
  [envLabel]="envLabel()"
  [hint]="hint()"
  [max]="2"
  [envs]="pair()"
  (envsChange)="onPair($event)"
  [(service)]="service"
/>

@if (withName()) {
  <div class="form-grid">
    <div>
      <label for="name">Nombre del parámetro / secreto</label>
      <input
        id="name"
        type="text"
        [value]="nameValue()"
        (input)="nameValue.set($any($event.target).value)"
        placeholder="p. ej. /yappy/dev/rate"
        spellcheck="false"
      />
    </div>
  </div>
}
