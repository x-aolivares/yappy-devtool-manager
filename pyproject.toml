[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yappy-cli-manager"
version = "5.34.0"
description = "Yappy CLI Manager - orquestador de sesiones AWS, SSM, RDS, Kafka y port-forwarding"
requires-python = ">=3.14"
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["docs/requirements.txt"]}
optional-dependencies = {dev = {file = ["docs/requirements-dev.txt"]}}

[project.scripts]
yappy = "yappy_cli.cli:app"

[tool.setuptools.packages.find]
where = ["backend/library", "backend/api", "backend/cli"]
include = ["yappy_library*", "yappy_api*", "yappy_cli*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
# This gate exists to catch CORRECTNESS bugs, not to enforce style.
#
# Enabled deliberately narrow:
#   F821 - undefined name. A NameError shipped in `yappy setup` (it called
#          `_win_to_posix` while the function is `win_to_posix`) and the command
#          had never completed for anyone. Nothing caught it.
#   F811 - redefinition of a name in the same scope (silent logic bugs)
#   E9   - syntax / IO errors that break the interpreter outright
#
# Deliberately NOT enforced, and why:
#   F401 unused imports  - style; the three in yappy_cli/ are now cleaned up
#   F541 f-string w/o {} - pure style, 9 occurrences, zero risk
#   F841 unused variable - actively HARMFUL here: backend/cli/yappy_cli/workflow/executor.py
#                          calls session.multiple.pf(...) for its side effect
#                          (opening port-forwards) and ignores the return value.
#                          "Fixing" that would tear down working tunnels.
line-length = 100
target-version = "py314"
exclude = [".venv", "build", "backend/build", "dist", "frontend"]

[tool.ruff.lint]
select = ["F821", "F811", "E9"]

# --- mypy -------------------------------------------------------------------
#
# Las anotaciones de este repo existen y nunca se verificaban. El código está
# anotado a mano (`from __future__ import annotations`, `str | None`,
# `dict[str, str]`, `-> tuple[str, int]`), lo que significa que la intención
# ya está escrita: faltaba el que la mirara.
#
# El gate es de *corrección*, como el de ruff: no busca estilo, busca que los
# tipos que el código dice tener sean los que tiene. Un `cfg.get("X")` que
# puede devolver `None` y se pasa a algo que espera `str` es un `None` que
# viaja hasta que algo explota —o no explota, que es peor.
#
# `ignore_missing_imports`: los stubs de `typer`, `rich`, `pymysql` y `boto3`
# no están, y no vale la pena mantener stubs propios para eso.
#
# `check_untyped_defs`: sin esto, mypy no mira el cuerpo de las funciones sin
# anotar, que es la mitad del código. Es la diferencia entre un gate que
# existe y uno que decoraría.
[tool.mypy]
python_version = "3.14"
# El gate es del código que corre en producción. Los tests no entran: usan
# dobles sintéticos donde la producción usa objetos reales (`SimpleNamespace`
# en lugar de un `Config`), y `monkeypatch` de un método no es un error —es
# lo que hacen—. La mitad de los errores que mypy reportaba en los tests eran
# el patrón `lambda: calls.append(x)`, que es correcto en Python.
files = ["backend/library", "backend/api", "backend/cli"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
show_error_codes = true

