[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yappy-cli-manager"
version = "1.6.0"
description = "Yappy CLI Manager - orquestador de sesiones AWS, SSM, RDS, Kafka y port-forwarding"
requires-python = ">=3.14"
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["docs/requirements.txt"]}
optional-dependencies = {dev = {file = ["docs/requirements-dev.txt"]}}

[project.scripts]
yappy = "cli.cli:app"

[tool.setuptools.packages.find]
include = ["library*", "cli*", "web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
