name: CI

# El gate vive acá y no solo en AGENTS.md: un documento que dice qué correr no
# corre nada. Esta sesion se pushearon 50 commits con el gate ejecutado a mano, y
# en un momento un test fallo y casi entra igual. Que lo corra GitHub cada vez.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Dos pushes seguidos a master: el primero quedo obsoleto en cuanto llego el
# segundo. Gastar runner en los dos es tirar tiempo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # El piso real del proyecto: pyproject.toml pide >=3.14 y ruff apunta
          # a py314. Correrlo en una version anterior deja de chequear la
          # sintica que se ejecuta en produccion.
          python-version: '3.14'

      - name: Instalar dependencias
        # `pip install -e .` no es opcional: los tests importan yappy_library,
        # yappy_api y yappy_cli, que son paquetes del repo (pyproject los toma
        # de backend/library, backend/api y backend/cli). Localmente funcionan
        # porque el paquete esta instalado en editable; en un runner limpio no
        # existe y pytest muere con ModuleNotFoundError en 32 modulos.
        #
        # `pip install -e .` ya arrastra docs/requirements.txt, porque setuptools
        # lee las dependencias de ahi. Solo hay que sumar las de desarrollo.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r docs/requirements-dev.txt

      - name: ruff
        # Gate de correccion, no de estilo: F821, F811 y E9. El F821 existe por
        # un NameError que llego a produccion sin que nada lo cachara.
        run: python -m ruff check backend backend/tests

      - name: pytest
        run: python -m pytest

      - name: openapi.json al día
        # `frontend/openapi.json` y `frontend/src/app/api-gen/` están
        # commiteados, y hasta ahora no había forma de regenerarlos salvo
        # acordarse del `npx` a mano — nadie lo encuentra solo, y un endpoint
        # nuevo sin regenerar compila igual y falla en runtime, que es la peor
        # forma de fallar. Este paso regenera el spec desde la app y falla si
        # cambió: obliga a correr `npm run api:gen` en el mismo commit.
        #
        # Va en el job de backend y no en el de frontend a propósito: acá ya
        # está `pip install -e .`, que es lo que permite importar `yappy_api`.
        run: |
          cd frontend
          npm run api:spec
          cd ..
          git diff --exit-code -- frontend/openapi.json || (
            echo "::error::frontend/openapi.json quedó desactualizado. Corré 'npm run api:gen' en frontend/ y commiteá el resultado."
            exit 1
          )

  frontend:
    name: Frontend (Vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Angular 22 pide Node 20.19+; 22 es la LTS que cubre sin adivinar.
          node-version: '22'
          # Con package-lock.json en el repo, el cache de npm es seguro y evita
          # descargar el arbol de dependencias en cada run.
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        # Sin --watch=false el runner se queda esperando tests de forma infinita.
        # En local el default es interactivo; en CI tiene que terminar solo.
        run: npx ng test --watch=false

      - name: Build
        # El build de produccion, no el de desarrollo: es el unico que pasa por
        # los budgets de angular.json (500kB de aviso, 1MB de error), y los
        # tests no compilan la aplicacion.
        run: npx ng build