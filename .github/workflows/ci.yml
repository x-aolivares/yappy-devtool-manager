name: CI

# El gate vive acá y no solo en AGENTS.md: un documento que dice qué correr no
# corre nada. Esta sesion se pushearon 50 commits con el gate ejecutado a mano, y
# en un momento un test fallo y casi entra igual. Que lo corra GitHub cada vez.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Dos pushes seguidos a master: el primero quedo obsoleto en cuanto llego el
# segundo. Gastar runner en los dos es tirar tiempo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# El job solo lee el repo. Sin esto, el token del workflow puede escribir en
# el repo y en los packages: el minimo de permisos que hace falta para correr tests.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    # Un test colgado se queda con las seis horas default del runner. Con este
    # tope, se ve que algo se colgó en quince minutos en vez de en tres horas.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          # El piso real del proyecto: pyproject.toml pide >=3.14 y ruff apunta
          # a py314. Correrlo en una version anterior deja de chequear la
          # sintica que se ejecuta en produccion.
          python-version: '3.14'
          # `pip install -e .` arrastra awscli, que pesa; con el cache, el
          # runner no lo descarga en cada run.
          cache: pip
          cache-dependency-path: |
            docs/requirements.txt
            docs/requirements-dev.txt

      - name: Instalar dependencias
        # `pip install -e .` no es opcional: los tests importan yappy_library,
        # yappy_api y yappy_cli, que son paquetes del repo (pyproject los toma
        # de backend/library, backend/api y backend/cli). Localmente funcionan
        # porque el paquete esta instalado en editable; en un runner limpio no
        # existe y pytest muere con ModuleNotFoundError en 32 modulos.
        #
        # `pip install -e .` ya arrastra docs/requirements.txt, porque setuptools
        # lee las dependencias de ahi. Solo hay que sumar las de desarrollo.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r docs/requirements-dev.txt

      - name: ruff
        # Gate de correccion, no de estilo: F821, F811 y E9. El F821 existe por
        # un NameError que llego a produccion sin que nada lo cachara.
        run: python -m ruff check backend backend/tests

      - name: mypy
        # Las anotaciones de este repo existen y nunca se verificaban. El
        # codigo esta anotado a mano, lo que significa que la intencion ya
        # esta escrita: faltaba el que la mirara.
        #
        # El alcance es el codigo de produccion —library, api y cli—: los
        # tests usan dobles sinteticos donde la produccion usa objetos reales,
        # y `monkeypatch` de un metodo no es un error.
        #
        # No es un gate de estilo: no pide anotaciones donde no las hay. Lo que
        # mira es que los tipos que el codigo dice tener sean los que tiene.
        run: python -m mypy

      - name: pytest
        # Se usa `coverage` y no `pytest-cov` a proposito: `coverage` ya es una
        # dependencia compartida con bbit-release-manager, y sumar `pytest-cov`
        # solo en este repo crearia drift en el stack comun.
        run: |
          python -m coverage run --source=backend -m pytest
          python -m coverage report --skip-covered
          python -m coverage xml

      - name: la cobertura no baja
        # Hoy la cobertura de `backend/` es de 90%. El piso está 5 puntos
        # abajo: no es un objetivo, es una red contra los módulos que se
        # quedan sin test. Sin esto, un módulo nuevo sin test pasa desapercibido.
        run: |
          python -m coverage report --fail-under=85

      - name: openapi.json al día
        # `frontend/openapi.json` y `frontend/src/app/api-gen/` están
        # commiteados, y hasta ahora no había forma de regenerarlos salvo
        # acordarse del `npx` a mano — nadie lo encuentra solo, y un endpoint
        # nuevo sin regenerar compila igual y falla en runtime, que es la peor
        # forma de fallar. Este paso regenera el spec desde la app y falla si
        # cambió: obliga a correr `npm run api:gen` en el mismo commit.
        #
        # Va en el job de backend y no en el de frontend a propósito: acá ya
        # está `pip install -e .`, que es lo que permite importar `yappy_api`.
        run: |
          cd frontend
          npm run api:spec
          cd ..
          git diff --exit-code -- frontend/openapi.json || (
            echo "::error::frontend/openapi.json quedó desactualizado. Corré 'npm run api:gen' en frontend/ y commiteá el resultado."
            exit 1
          )

  frontend:
    name: Frontend (Vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Angular 22 pide Node 20.19+; 22 es la LTS que cubre sin adivinar.
          node-version: '22'
          # Con package-lock.json en el repo, el cache de npm es seguro y evita
          # descargar el arbol de dependencias en cada run.
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        # Sin --watch=false el runner se queda esperando tests de forma infinita.
        # En local el default es interactivo; en CI tiene que terminar solo.
        run: npx ng test --watch=false

      - name: Build
        # El build de produccion, no el de desarrollo: es el unico que pasa por
        # los budgets de angular.json (500kB de aviso, 1MB de error), y los
        # tests no compilan la aplicacion.
        #
        # El build **es** el type check del frontend: `ng build` falla si un
        # template no cumple el tipo que el componente dice tener, con
        # `strict` y `strictTemplates` prendidos en `tsconfig.json`.
        run: npx ng build

      - name: el cliente generado está al día
        # El paso del backend mira `openapi.json`, que es el contrato. Este
        # mira el otro lado: el cliente de TypeScript que sale de él. Sin este
        # paso, un cambio de modelo en el backend dejaba el cliente viejo
        # commiteado — compila igual, y falla en runtime, que es la peor
        # forma de fallar.
        run: |
          npx ng-openapi-gen
          git diff --exit-code -- src/app/api-gen || (
            echo "::error::frontend/src/app/api-gen/ quedó desactualizado. Corré 'npm run api:gen' en frontend/ y commiteá el resultado."
            exit 1
          )

      - name: formato (informativo)
        # `prettier` estaba en devDependencies y no lo invocaba nadie. Acá se
        # reporta la deuda sin bloquear: el repo todavía no está formateado
        # (147 archivos), y reformatear de golpe en un PR de cambios reales
        # tapa el diff y mueve whitespace dentro de templates de Angular, que
        # es texto que se renderiza.
        #
        # Cuando el reformateo se haga en su propio commit, este paso pasa a
        # `continue-on-error: false` y deja de ser informativo.
        continue-on-error: true
        run: npx prettier --check "src/**/*.{ts,html,scss}"

  windows:
    name: Windows (pytest)
    runs-on: windows-latest
    timeout-minutes: 20

    # El producto es Windows-first: `taskkill`, `ctypes.wintypes`, y el
    # snapshot de la tabla de procesos con la API de Toolhelp. Todo eso
    # estaba sin verificar en CI, porque el único job corría en Linux — y las
    # aserciones de Windows están marcadas con `skipif(sys.platform !=
    # "win32")`, así que en Linux no se ejecutaban. Este job es el que las
    # corre.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            docs/requirements.txt
            docs/requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r docs/requirements-dev.txt

      - name: pytest
        run: python -m pytest
